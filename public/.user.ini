; heroku-php-apache2 (DigitalOcean App Platform) ships with tiny default
; upload limits (~1-2M), well under our app-level 20MB avatar/import limits.
; PHP silently drops the upload before Laravel ever sees it, surfacing as
; Laravel's generic "The :attribute failed to upload." validation error.
upload_max_filesize = 25M
post_max_size = 26M
memory_limit = 256M
